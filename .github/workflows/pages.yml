name: Publier la galerie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet et les images LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restaurer les vraies images
        run: |
          if [ ! -d assets ] || grep -RIl --exclude='*.json' 'version https://git-lfs.github.com/spec' assets | head -1; then
            echo "Images LFS détectées : reconstruction depuis les galeries autorisées."
            FORCE_DOWNLOAD=1 node download-galleries.mjs
          fi
          if [ ! -d assets ] || [ "$(find assets -type f | wc -l)" -eq 0 ]; then
            echo "Aucune image disponible après reconstruction."
            exit 1
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
