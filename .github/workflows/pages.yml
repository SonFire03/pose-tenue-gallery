name: Publier la galerie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet et les images LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Forcer le téléchargement des images LFS
        run: |
          git lfs pull
          git lfs checkout
          if grep -RIl --exclude='*.json' 'version https://git-lfs.github.com/spec' assets | head -1; then
            echo "Des pointeurs Git LFS sont encore présents dans assets/."
            exit 1
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
